services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relocation_vietnam
      POSTGRES_USER: rv_dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VPS environment}
    volumes:
      - rv_pgdata:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rv_dashboard -d relocation_vietnam"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://rv_dashboard:${POSTGRES_PASSWORD}@db:5432/relocation_vietnam
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the verified HTTPS hostname}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
      - edge

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the verified HTTPS hostname}
    ports:
      - "80:80"
      - "443:443"
    command: ["caddy", "reverse-proxy", "--from", "${APP_ORIGIN}", "--to", "app:3000"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - edge

networks:
  private:
    internal: true
  edge:

volumes:
  rv_pgdata:
  caddy_data:
  caddy_config:
