name: Publish VPS dashboard image

on:
  push:
    branches:
      - codex/vps-migration-foundation
    paths:
      - "vps-migration/**"
      - ".github/workflows/publish-vps-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed migration branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./vps-migration
          file: ./vps-migration/api/Dockerfile
          push: true
          tags: ghcr.io/bags0fice/relocation-vietnam-dashboard:pilot
